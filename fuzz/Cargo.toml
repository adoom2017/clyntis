[package]
name = "clyntis-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
clyntis-protocol = { path = "../crates/protocol", features = ["fuzzing"] }

[workspace]
members = ["."]

# The protocol crate calls BoringSSL functions only the vendored copy has.
[patch.crates-io]
boring-sys = { path = "../third-party/boring-sys" }

[[bin]]
name = "vless_frames"
path = "fuzz_targets/vless_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xudp_frames"
path = "fuzz_targets/xudp_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vision_frames"
path = "fuzz_targets/vision_frames.rs"
test = false
doc = false
bench = false
