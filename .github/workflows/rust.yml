name: Rust Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build local desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Build local desktop package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-release.sh
      - name: Isolated Linux desktop routing and recovery
        if: runner.os == 'Linux'
        run: sudo unshare --net --fork python3 scripts/test-desktop-linux.py "$PWD/target/release/clyntis"
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.93.1 --profile minimal --target aarch64-apple-ios
      - run: cargo fetch --locked
      - name: Build iOS arm64 Core and FFI
        shell: bash
        run: bash scripts/check-mobile.sh ios --release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.93.1 --profile minimal --target aarch64-linux-android
      - run: cargo fetch --locked
      - name: Install pinned Android NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973' >/dev/null
      - name: Build Android arm64 Core and FFI
        shell: bash
        run: bash scripts/check-mobile.sh android "$ANDROID_HOME/ndk/27.0.12077973" --release
