name: Desktop Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    env:
      CLYNTIS_UPDATER_PUBLIC_KEY: ${{ vars.CLYNTIS_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check updater credentials
        shell: bash
        run: |
          test -n "$CLYNTIS_UPDATER_PUBLIC_KEY" || { echo '::error::Set repository variable CLYNTIS_UPDATER_PUBLIC_KEY'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error::Set secret TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
      - name: Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target ${{ matrix.target }}
      - name: Tag matches the product version
        shell: bash
        run: |
          app=$(node -p "require('./desktop/package.json').version")
          cli=$(cargo metadata --no-deps --format-version 1 --offline | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).packages.find(p=>p.name==='clyntis').version))")
          test "${GITHUB_REF_NAME#v}" = "$app" && test "$cli" = "$app" || { echo '::error::Tag, app and crate versions must agree; run scripts/set-version.sh'; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: release-${{ matrix.target }}
      - name: Windows native prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo '::error::Configure Developer ID and notarization credentials; see desktop/UPDATES.md'; exit 1; }
          keychain="$RUNNER_TEMP/clyntis-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/clyntis-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/clyntis-signing.p12" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: CLI and C library package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -OutputDirectory release
      - name: Install frontend dependencies and run tests
        working-directory: desktop
        run: |
          npm ci
          npm test
      - name: Build Windows updater installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: node packaging/build.mjs --updater --ci --target ${{ matrix.target }} --bundles nsis
      - name: Build signed and notarized macOS updater
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: node packaging/build.mjs --updater --ci --target ${{ matrix.target }} --bundles app,dmg
      - name: Collect signed updater assets
        shell: bash
        run: node desktop/packaging/updates.mjs collect desktop/target/${{ matrix.target }}/release/bundle assets "${GITHUB_REF_NAME#v}" ${{ matrix.platform }}
      - name: Collect Windows CLI assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item release/*.tar.gz, release/*.tar.gz.sha256 -Destination assets
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: assets/*
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/clyntis-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/clyntis-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/clyntis-signing.p12"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish complete release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Clyntis $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/notes.txt"
          node desktop/packaging/updates.mjs manifest assets latest.json "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/notes.txt"
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
