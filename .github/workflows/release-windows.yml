name: Windows Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip Defender scans of build output
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Tag matches the product version
        shell: bash
        run: |
          app=$(node -p "require('./desktop/package.json').version")
          cli=$(cargo metadata --no-deps --format-version 1 --offline \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).packages.find(p=>p.name==='clyntis').version))")
          if [ "${GITHUB_REF_NAME#v}" != "$app" ] || [ "$cli" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, app $app and crates $cli must agree; run scripts/set-version.sh before tagging."
            exit 1
          fi
      - name: Windows native prerequisites
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fetch --locked
      - name: CLI and C library package
        shell: pwsh
        run: ./scripts/package-release.ps1 -OutputDirectory release
      - name: Desktop installer
        working-directory: desktop
        run: |
          npm ci
          npm run desktop:build -- --unsigned
      - name: Collect assets
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path assets
          Copy-Item release/*.tar.gz, release/*.tar.gz.sha256 -Destination $out
          foreach ($installer in Get-ChildItem desktop/target/release/bundle/nsis/*.exe) {
            Copy-Item $installer.FullName -Destination $out
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)`n" | Set-Content -LiteralPath (Join-Path $out "$($installer.Name).sha256") -Encoding ascii -NoNewline
          }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@v6
        with:
          name: clyntis-${{ github.ref_name }}-windows
          path: assets/*
          if-no-files-found: error
      - name: Publish to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the job replaces the assets of an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "Clyntis $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
