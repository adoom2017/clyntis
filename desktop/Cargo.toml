[workspace]
members = ["model", "runner", "service", "src-tauri"]
default-members = ["model", "runner", "service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
meta-config = { path = "../crates/config" }
meta-runtime = { path = "../crates/runtime" }
clyntis-desktop-model = { path = "model" }
clyntis-desktop-service = { path = "service" }

[patch.crates-io]
boring-sys = { path = "../third-party/boring-sys" }
route_manager = { path = "../third-party/route_manager" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

