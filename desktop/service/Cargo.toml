[package]
name = "clyntis-desktop-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clyntis-service"
path = "src/main.rs"

[dependencies]
clyntis-desktop-model.workspace = true
meta-runtime.workspace = true
meta-config.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
libc = "0.2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
