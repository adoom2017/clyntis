[package]
name = "meta-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
meta-config.workspace = true
meta-protocol.workspace = true
meta-platform.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
base64.workspace = true
bytes.workspace = true
ipnet.workspace = true
http.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hickory-proto = "0.25"
httparse = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_yaml.workspace = true
prost = "0.14"
maxminddb = "0.26"
socket2.workspace = true
sha2 = "0.10"
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "fragmentation-buffer-size-65536", "reassembly-buffer-size-65536", "socket-tcp", "socket-udp", "socket-icmp"] }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dev-dependencies]
route_manager = "=0.2.9"
